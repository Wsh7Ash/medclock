name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests -q
      - name: Demo
        run: python scripts/demo.py
      - name: Assert the proof, the core and the relaxation costs
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          text = pathlib.Path("results/demo.txt").read_text(encoding="utf-8")
          assert "expectations met: True" in pathlib.Path("results/gate.txt").read_text(encoding="utf-8")
          assert "INFEASIBILITY PROOF" in text
          assert "MINIMAL UNSATISFIABLE CORE (3 of 7 groups" in text
          assert "GATE     feasible -> PASS" in text

          proc = subprocess.run(
              [sys.executable, "-m", "medclock", "check", "fixtures/pinch.json", "--json"],
              capture_output=True,
              text=True,
              env={"PYTHONPATH": "src", "PATH": "/usr/bin:/bin"},
          )
          assert proc.returncode == 1, proc.stdout
          payload = json.loads(proc.stdout)
          diagnostics = payload["diagnostics"]
          assert diagnostics["cycle"]["weight_minutes"] == 120
          assert len(diagnostics["core"]) == 3
          assert [item["minutes"] for item in diagnostics["relaxations"]] == [120, 120, 120]
          print("demo assertions passed")
          PY
